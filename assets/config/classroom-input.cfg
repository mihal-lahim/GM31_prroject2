# Classroom Walk のキーコンフィグです。
# 「操作名 = キー, キー, ...」の形で書きます。書いた操作だけが既定の割り当てから置き換わります。
# 書ける名前: A〜Z 0〜9 F1〜F12 SPACE ENTER ESC TAB LSHIFT RSHIFT LCTRL RCTRL UP DOWN LEFT RIGHT
#             MOUSE_LEFT MOUSE_RIGHT
#             PAD_A PAD_B PAD_X PAD_Y PAD_LB PAD_RB PAD_LT PAD_RT PAD_START PAD_BACK
#             PAD_UP PAD_DOWN PAD_LEFT PAD_RIGHT PAD_LX+ PAD_LX- PAD_LY+ PAD_LY-
# 行頭に # を付けた行は既定のままです。
# look_left/right/up/down は右スティックの視点操作です(PAD_RX-/+ PAD_RY-/+)。

# move_forward = W, UP, PAD_LY+
# move_back    = S, DOWN, PAD_LY-
# move_right   = D, RIGHT, PAD_LX+
# move_left    = A, LEFT, PAD_LX-
# jump         = SPACE, PAD_A
# dance        = R, PAD_Y
