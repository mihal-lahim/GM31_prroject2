# Toy Wire - Sky Race のキーコンフィグです。
# 「操作名 = キー, キー, ...」の形で書きます。書いた操作だけが既定の割り当てから置き換わります。
# 書ける名前: A〜Z 0〜9 F1〜F12 SPACE ENTER ESC TAB LSHIFT RSHIFT LCTRL RCTRL UP DOWN LEFT RIGHT
#             MOUSE_LEFT MOUSE_RIGHT
#             PAD_A PAD_B PAD_X PAD_Y PAD_LB PAD_RB PAD_LT PAD_RT PAD_START PAD_BACK
#             PAD_UP PAD_DOWN PAD_LEFT PAD_RIGHT PAD_LX+ PAD_LX- PAD_LY+ PAD_LY-
# 行頭に # を付けた行は既定のままです。

# move_forward = W, PAD_LY+
# move_back    = S, PAD_LY-
# move_right   = D, PAD_LX+
# move_left    = A, PAD_LX-
# jump         = SPACE, PAD_A
# blink        = LSHIFT, RSHIFT, PAD_B
# aim          = MOUSE_RIGHT, PAD_LT
# attack       = MOUSE_LEFT, PAD_RT
# confirm      = ENTER, PAD_A
# back         = ESC, PAD_BACK
# retry        = R, PAD_Y
# pause        = TAB, PAD_START
# tutorial     = T, PAD_X
