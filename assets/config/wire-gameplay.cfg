# Wire Actionのゲームプレイ調整値です。
# 単位は距離=m、時間=秒、角度=ラジアン（degreesと付く項目だけ度）です。
# 範囲外や非数値はランタイム側で安全な値へ補正され、デバッグ出力に警告されます。

