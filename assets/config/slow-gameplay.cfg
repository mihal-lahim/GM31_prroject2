# SlowAction(時間減速アクション試作)のゲームプレイ調整値です。
# 単位は距離=m、時間=秒、速さ=m/s。Degreesと付く項目だけ度です。
# 各項目の意味は include/slowActionTuning.h のコメントを参照してください。
# 行を消すとコード側の既定値に戻ります。範囲(0〜既定値の10倍)を外れた値は範囲内へ丸められます。

