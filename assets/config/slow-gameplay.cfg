# SlowAction(時間減速アクション試作)のゲームプレイ調整値です。
# 単位は距離=m、時間=秒、速さ=m/s。Degreesと付く項目だけ度です。
# 各項目の意味と既定値は include/slowActionTuning.def を参照してください(項目を足す・消すのもそのファイルだけです)。
# そこに無いキーを書くと、画面左上に警告が出て自動テストが失敗します。
# 行を消すとコード側の既定値に戻ります。範囲(0〜既定値の10倍)を外れた値は範囲内へ丸められます。

# プレイヤー移動
slow.WalkSpeed=6.0
slow.WalkAcceleration=70.0
slow.DashSpeed=16.0
slow.DashSteer=9.0
slow.TurnSpeed=25.0
slow.PlayerRadius=0.4
slow.PlayerHeight=1.8
slow.PlayerMaxHp=100

# 攻撃
slow.StrongHoldSeconds=0.25
slow.AttackBufferSeconds=0.2
# 通常攻撃の3段コンボ。Start/Hit/Endは大剣の3連撃クリップに対する割合(0〜1)
slow.Combo1Start=0.14
slow.Combo1Hit=0.19
slow.Combo1End=0.31
slow.Combo2Start=0.31
slow.Combo2Hit=0.475
slow.Combo2End=0.56
slow.Combo3Start=0.56
slow.Combo3Hit=0.71
slow.Combo3End=0.95
slow.ComboPlaybackSpeed=2.0
slow.ComboChainSeconds=0.3
# 右手の剣。向きは指の骨から決まり、ここでは大きさと握る位置のずれ(メートル)だけ
slow.SwordScale=1.0
slow.SwordGripOffsetX=0.0
slow.SwordGripOffsetY=0.0
slow.SwordGripOffsetZ=0.0
slow.NormalRange=2.8
slow.NormalHalfAngleDegrees=40.0
slow.NormalDamage=1
# 強攻撃(回転斬り)。Clip*は Akai_Strong.fbx に対する割合(0〜1)で、長さと当たる瞬間はここから決まる
slow.StrongClipStart=0.745
slow.StrongClipHit=0.915
slow.StrongClipEnd=1.0
slow.StrongPlaybackSpeed=3.4
# クリップが読めないときだけ使う秒数
slow.StrongDuration=0.7
slow.StrongHitDelay=0.22
slow.StrongCancelSeconds=0.35
slow.StrongRange=4.2
slow.StrongHalfAngleDegrees=75.0
slow.StrongDamage=1
slow.AttackVerticalReach=3.2
slow.AimAssistRange=6.0
slow.AimAssistHalfAngleDegrees=50.0
# 通常攻撃のロック: 当たるまで向きを追い、敵との隙間がGapになるまで(最大MaxDistance)踏み込む
slow.NormalLungeMaxDistance=2.2
slow.NormalLungeGap=0.7
slow.AimTrackDegreesPerSecond=720.0
slow.StrongHitStopFrames=9
slow.HitStopScale=0.1

# 時間減速
slow.SlowTimeScale=0.35
slow.SlowBlendSeconds=0.08
slow.GaugeMax=100.0
slow.GaugeDrainPerSecond=22.0
slow.GaugeGainNormalHit=5.0
slow.GaugeGainStrongHit=8.0
slow.GaugeGainPursuit=18.0
# ジャスト減速: 敵の攻撃が当たる直前に発動するとゲージ回復と得点
slow.JustSlowWindowSeconds=0.3
slow.JustSlowBulletRange=3.0
slow.JustSlowGaugeGain=20.0

# 時間減速の演出: 画面の彩度・寒色・外周の暗さ(減速しきったときの強さ 0〜1)、衝撃波とフラッシュの時間、
# 漂う光の粒の数、減速中のダッシュ・攻撃の軌跡の粒の数(1フレームあたり)
slow.SlowFxDesaturate=0.65
slow.SlowFxTint=0.35
slow.SlowFxVignette=0.45
slow.SlowFxWaveSeconds=0.35
slow.SlowFxFlashSeconds=0.12
slow.SlowFxDustCount=70
slow.SlowFxTrailPerFrame=3

# 吹き飛ばし
slow.LaunchDistance=6.0
slow.LaunchSeconds=1.2
slow.LaunchHeight=1.8
slow.LaunchMaxHeight=2.4
slow.LaunchSpeedFalloff=0.8
# 通常攻撃3段目の打ち上げ(ほぼ真上へ高く)
slow.FinisherLaunchDistance=0.5
slow.FinisherLaunchHeight=3.0
slow.FinisherLaunchSeconds=1.1
slow.MaxWallBounces=1
slow.WallBounceHangSeconds=0.3
slow.RecoverSeconds=0.45

# 敵
slow.EnemyHp=6
slow.PursuitDamageBonus=1
slow.EnemyRadius=0.45
