slow.DashLeanDegrees=6.0

# 溜めの演出: 剣の震え、吸い込む範囲、1フレームの粒の数
slow.ChargeShakeMeters=0.012
slow.ChargeGatherRadius=1.4
slow.ChargeGatherPerFrame=2
