slow.BruteAttackDamage=25
slow.BruteArmor=2
slow.BruteStaggerSeconds=0.18
slow.BruteLaunchScale=0.6

# 手触り
slow.NormalHitStopFrames=7
slow.FinisherHitStopFrames=11
slow.PursuitHitStopFrames=9
slow.KillHitStopFrames=13
slow.ShakeStrongHit=0.12
slow.ShakeWallBounce=0.18
slow.ShakeKill=0.22
