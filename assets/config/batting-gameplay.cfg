# Batting Center: 打撃の当たり方と飛距離
# 時間は秒、長さ・半径はゲーム内距離、powerは打球へ加える速度です。
# 安全な調整範囲: duration=0.03～5、length=0.1～20、radius=0.01～10、power=0～500
batting.bat.swing_duration=0.32
batting.bat.hit_window_start=0.16
batting.bat.hit_window_end=0.78
batting.bat.length=2.15
batting.bat.hit_radius=0.62
batting.bat.hit_power=29.0
batting.bat.hit_lift=2.4

# 投球間隔・位置・速度
batting.pitch.initial_delay=1.0
batting.pitch.interval=2.2
batting.pitch.spawn_offset_x=0.0
batting.pitch.spawn_offset_y=1.0
batting.pitch.spawn_offset_z=-1.2
batting.pitch.horizontal_spread=1.1
batting.pitch.vertical_spread=0.6
batting.pitch.velocity_z=-13.5

# ボールの物理・寿命・壁反射
batting.ball.scale=0.35
batting.ball.collider_radius=0.55
batting.ball.lifetime=8.0
batting.ball.gravity=-2.0
batting.ball.trail_interval=0.03
batting.ball.miss_destroy_z=-8.0
batting.ball.wall_bounce_z=-0.62
batting.ball.wall_bounce_x=0.72
batting.ball.wall_bounce_lift=3.0
batting.ball.wall_separation=0.25
batting.ball.wall_explosion_delay=0.28

# 得点と演出量。演出数はGPU負荷にも直結します。
batting.target.default_score=100
batting.target.hit_flash_duration=0.55
batting.target.hit_pulse_scale=0.7425
batting.effects.trail_particle_count=2
batting.effects.target_burst_particle_count=150
batting.effects.wall_explosion_particle_count=42
