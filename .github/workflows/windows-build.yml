name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Validate project boundaries
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-project-boundaries.ps1

      - name: Build all projects
        run: msbuild GM31_prroject2.slnx /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /nologo /v:minimal

      # アプリは GUI の実行ファイルなので、直接呼ぶと終了を待たず結果も取れません。
      # スクリプトが Start-Process -Wait で待ち、1つでも失敗したら終了コード 1 を返します。
      - name: Self-test all apps
        shell: pwsh
        run: .\scripts\run-self-tests.ps1 -Configuration ${{ matrix.configuration }}
